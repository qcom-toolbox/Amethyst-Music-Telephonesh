name: Publish Pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag name for this pre-release (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Locate APKs
        id: apks
        run: |
          debug_apk=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          release_apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "debug_apk=$debug_apk" >> "$GITHUB_OUTPUT"
          echo "release_apk=$release_apk" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.apks.outputs.debug_apk }}
            ${{ steps.apks.outputs.release_apk }}
